spring:
  application:
    name: dolphin
  datasource:
    url: jdbc:postgresql://localhost:5432/dolphin
    username: springuser
    password: springpassword
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.flywaydb: DEBUG

dolphin:
  security:
    jwt:
      # No default: the application fails fast (see JwtService) if JWT_SECRET is
      # not supplied, so a committed key can never sign production tokens.
      secret: ${JWT_SECRET:}
      expiration-ms: 900000

app:
  notification:
    outbox:
      poll-delay-ms: 5000
