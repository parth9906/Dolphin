spring:
  application:
    name: dolphin
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  school:
    time-zone: ${SCHOOL_TIME_ZONE:Asia/Kolkata}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: DEBUG

dolphin:
  security:
    jwt:
      # No default: the application fails fast (see JwtService) if JWT_SECRET is
      # not supplied, so a committed key can never sign production tokens.
      secret: ${JWT_SECRET:}
      # Access-token lifetime. 15 minutes is the accepted authorization
      # staleness ceiling: deactivation/permission changes propagate on the
      # next refresh, not on every request.
      expiration-ms: 900000
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
      issuer: dolphin
      audience: dolphin-api

app:
  notification:
    outbox:
      poll-delay-ms: 5000
  invitation:
    email:
      enabled: ${INVITATION_EMAIL_ENABLED:false}
      from: ${INVITATION_EMAIL_FROM:no-reply@example.invalid}
      base-url: ${INVITATION_BASE_URL:http://localhost:3000/accept-invitation}
      validity-hours: 24
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


